name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (api, lib, shared, app)
        run: |
          for f in $(find api lib shared js -name '*.js') dev-server.mjs diaper-messaging-sw.js; do
            node --check "$f"
          done
      - name: Unit tests
        run: npm test
